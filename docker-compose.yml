services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartretail
      POSTGRES_USER: smartretail
      POSTGRES_PASSWORD: change_me
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartretail"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]
volumes:
  postgres_data:
  mongo_data:
